<html>
<head>
    <title>E-commerce Products</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            margin-top: 20px;
        }

        #login-form {
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }

        #login-form input {
            margin: 5px;
            padding: 10px;
            font-size: 14px;
        }

        #login-form button {
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
        }

        #logout-button {
            display: none;
            margin: 20px auto;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
        }

        #products-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 50px;
        }

        .product {
            border: 1px solid #ddd;
            border-radius: 5px;
            width: 200px;
            margin: 10px;
            padding: 10px;
            text-align: center;
        }

        .product img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 5px;
        }

        .product h3 {
            font-size: 18px;
            margin: 10px 0;
        }

        .product p {
            font-size: 14px;
            margin: 5px 0;
        }
    </style>
    <script>
        // 1. Login and get the JWT token
        async function login(username, password) {
            console.log('Attempting to login...');
            const response = await fetch('http://127.0.0.1:8000/api/token/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ username, password }),
            });

            const data = await response.json();
            console.log('Login response:', data);  // Log the response

            if (data.access) {
                // Store the access token if login is successful
                localStorage.setItem('access_token', data.access);
                document.getElementById('logout-button').style.display = 'block'; // Show logout button
                fetchProducts();  // Fetch products after successful login
            } else {
                alert('Login failed. Please check your credentials.');
            }
        }

        // 2. Fetch and display products
        async function fetchProducts() {
            const token = localStorage.getItem('access_token');
            if (!token) {
                alert('You must be logged in to view the products.');
                return;
            }

            const response = await fetch('http://127.0.0.1:8000/api/products/', {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                },
            });

            if (response.status === 401) {
                // If the response is Unauthorized (401), prompt the user to log in again
                alert('Your session has expired or you are not authorized. Please log in again.');
                localStorage.removeItem('access_token');
                document.getElementById('logout-button').style.display = 'none';
                return;
            }

            if (response.ok) {
                const products = await response.json();
                displayProducts(products);
            } else {
                alert('Failed to fetch products. Please try again.');
            }
        }

        // 3. Display products on the webpage
        function displayProducts(products) {
            const productsContainer = document.getElementById('products-container');
            productsContainer.innerHTML = '';  // Clear any previous data

            products.forEach(product => {
                const productElement = document.createElement('div');
                productElement.classList.add('product');
                productElement.innerHTML = `
                    <h3>${product.name}</h3>
                    <p>Price: $${product.price}</p>
                    <p>Manufacturer: ${product.manufacturer}</p>
                `;
                productsContainer.appendChild(productElement);
            });
        }

        // Handle form submission to login
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('login-form').addEventListener('submit', function (event) {
                event.preventDefault();
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                login(username, password);  // Attempt login
            });

            // Handle logout
            document.getElementById('logout-button').addEventListener('click', () => {
                // Remove access token from local storage
                localStorage.removeItem('access_token');

                // Hide the logout button and clear products data
                document.getElementById('logout-button').style.display = 'none';

                // Clear product container and reset form
                document.getElementById('products-container').innerHTML = ''; // Clear product list
                document.getElementById('username').value = '';  // Reset the username input
                document.getElementById('password').value = '';  // Reset the password input

                alert('You have been logged out.');
            });
        });
    </script>
</head>
<body>
    <h1>Welcome to Our E-commerce Store</h1>

    <!-- Login Form -->
    <form id="login-form">
        <input type="text" id="username" placeholder="Username" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit">Login</button>
    </form>

    <!-- Logout Button -->
    <button id="logout-button">Logout</button>

    <!-- Products Container (fetched after login) -->
    <div id="products-container">
        <!-- Products will be displayed here -->
    </div>

</body>
</html>
